<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071009">
<title>حصّالة اليوم — لا يوجد اتصال</title>
<style>
:root{color-scheme:dark}
body{background:#071009;color:#F4F1E6;font-family:'Cairo',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
.card{background:#0B1512;border:1px solid rgba(217,169,46,.16);border-radius:18px;padding:40px 32px;max-width:340px}
h1{font-size:1.2rem;margin:0 0 12px;color:#D9A92E}
p{color:#9AA39B;font-size:.9rem;line-height:2;margin:0 0 20px}
button{border:none;border-radius:12px;background:#2BBF66;color:#04140A;font-weight:800;
  font-size:.95rem;padding:14px 32px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>لا يوجد اتصال</h1>
  <p>تحقق من الشبكة وحاول مجددًا.<br>بياناتك محفوظة على جهازك وما راح تضيع.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>
<script>window.addEventListener('online',function(){location.reload();});</script>
</body>
</html>
